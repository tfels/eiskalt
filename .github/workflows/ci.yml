name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# cancel a still running CI of the same branch / PR when a newer commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8

jobs:
  build:
    name: Build
    needs: [unit-tests, linter]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - variant: debug
            task: Debug
          # release builds are unsigned, release-signing.properties is not available in CI
          - variant: release
            task: Release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      # Gradle caching, also validates gradle-wrapper.jar against the official checksums
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # build APK and bundle in one Gradle run, so the compiled sources are shared
      - name: Build ${{ matrix.variant }} apk and bundle
        run: ./gradlew assemble${{ matrix.task }} bundle${{ matrix.task }} --no-daemon --stacktrace

      - name: Upload ${{ matrix.variant }} apk and bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.variant }}
          path: |
            app/build/outputs/apk/${{ matrix.variant }}/
            app/build/outputs/bundle/${{ matrix.variant }}/
          retention-days: 30


  # now run our unit test
  unit-tests:
    name: Unit-Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write           # for uploading test results
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      # Gradle caching, also validates gradle-wrapper.jar against the official checksums
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew test --no-daemon --stacktrace

      - name: Publish Unit Test Results
        uses: dorny/test-reporter@v3
        if: success() || failure()
        with:
          name: Unit Tests Results
          path: 'app/build/test-results/testDebugUnitTest/*.xml'
          reporter: java-junit

  # run the linter
  linter:
    name: Linter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # for uploading SARIF
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      # Gradle caching, also validates gradle-wrapper.jar against the official checksums
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Upload Lint Results
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: lint-results
          path: app/build/reports/lint-results*
          retention-days: 7

      - name: Upload SARIF to GitHub
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: app/build/reports/lint-results-debug.sarif
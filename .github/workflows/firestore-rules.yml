name: Firestore Rules

# only when the rules, their tests or this workflow change
on:
  push:
    branches: ['**']
    paths:
      - 'firebase/**'
      - '.github/workflows/firestore-rules.yml'
  pull_request:
    branches: ['**']
    paths:
      - 'firebase/**'
      - '.github/workflows/firestore-rules.yml'

# cancel a still running test of the same branch / PR when a newer commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # test the Firestore rules (firebase/) on the emulator
  rules-tests:
    name: Firestore-Rules-Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # the Firestore emulator is a Java program
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: firebase/package-lock.json

      - name: Install dependencies
        run: npm ci

      # starts the emulator, runs the tests and stops the emulator again
      - name: Run rules tests
        run: npm run test:rules
